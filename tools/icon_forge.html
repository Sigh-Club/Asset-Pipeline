<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTC Icon Forge</title>
<style>
  body { background: #1d1f21; color: #d6d6d6; font-family: monospace; margin: 20px; }
  h1 { font-size: 18px; color: #ffd94d; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .panel { background: #26282b; padding: 12px; border: 1px solid #3a3d40; }
  canvas { image-rendering: pixelated; }
  label { display: block; margin: 6px 0 2px; color: #9a9a9a; }
  select, input { background: #14161a; color: #d6d6d6; border: 1px solid #3a3d40; padding: 3px; }
  button { background: #3a3d40; color: #d6d6d6; border: 1px solid #55585c; padding: 6px 10px; margin: 8px 4px 0 0; cursor: pointer; }
  button:hover { background: #4a4d51; }
  .small { color: #8a8a8a; font-size: 11px; }
</style>
</head>
<body>
<h1>MTC Icon Forge</h1>
<p>Pick an occupation and styles, shuffle seeds, click a variant to adopt it,
export 32x32 PNGs. Same 16x16 (x2) chunky family as the shipped score icons.
Data: icon_forge_data.js, generated by <b>icon_forge.py --emit-js</b>.</p>
<div class="wrap">
  <div class="panel">
    <canvas id="prev" width="320" height="320"></canvas><br>
    <button id="rnd">Randomise all</button>
    <button id="dl">Export 32x32 PNG</button>
    <button id="dlbig">Export 8x PNG</button>
    <button id="sheet">Export variant sheet</button>
  </div>
  <div class="panel">
    <label>Occupation</label>
    <select id="occupation"></select>
    <label>Palette</label>
    <select id="palette"></select>
    <label>Eyes</label>
    <select id="eyes"></select>
    <label>Mouth</label>
    <select id="mouth"></select>
    <label>Hair (no hat)</label>
    <select id="hair"></select>
    <label>Prop</label>
    <select id="prop"></select>
    <label>Wound streak</label>
    <select id="wound"><option value="1">on</option><option value="0">off</option></select>
    <label>Seed</label>
    <input id="seed" type="number" value="1" min="0" max="9999">
  </div>
  <div class="panel">
    <label>Variants (click to adopt)</label>
    <canvas id="vars" width="640" height="192"></canvas>
    <button id="revars">Reroll variants</button>
  </div>
</div>
<script>
// Rendering front-end for icon_forge.py's blueprint data
// (icon_forge_data.js is GENERATED by --emit-js - do not hand-edit).
const EYES = ["red", "alive", "dead", "hollow"];
const MOUTHS = ["blood", "flat", "fangs", "grin"];
const HAIR = ["messy", "bald", "cap", "bandana"];
const PROPS = ["none", "book", "knife"];

function rng32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function resolve(spec) {
  const occ = OCCUPATIONS[spec.occupation] || OCCUPATIONS.unemployed;
  return {
    hat: spec.hat !== undefined ? spec.hat : occ.hat,
    torso: spec.torso !== undefined ? spec.torso : occ.torso,
    main: spec.main || occ.main,
    dark: spec.dark || occ.dark,
  };
}

function headRows(pal, eyes, mouth, hair, wound, rng, hat) {
  let rows = HEAD_BASE.slice();
  if (hair === "bald") {
    rows[1] = rows[1].replace("LL", "GG");
    rows[2] = rows[2].split("L").join("G");
  } else if (hair === "cap") {
    rows[0] = "...OSSSSSSSSO...";
    rows[1] = "..OSSSSSSSSSSO..";
    rows[2] = ".OSSSSSSSSSSSO..";
  } else if (hair === "bandana") {
    rows[1] = "..OORRRRRRRRRO..";
    rows[2] = ".ORRRRRRRRRRRO..";
  } else if (hair === "messy" && rng() < 0.5) {
    const x = 4 + Math.floor(rng() * 8);
    rows[0] = rows[0].slice(0, x) + "G" + rows[0].slice(x + 1);
  }
  if (hat) rows = hat.concat(rows.slice(4));   // replace the hair region
  rows = rows.concat({
    red:    ["OGREEGGGGGEEEGO.", "OGRWEGGGGEEEGO.."],
    alive:  ["OGEEEGGGGGEEEGO.", "OGEWEGGGGGEWEGO."],
    dead:   ["OGEEEGGGGGEEEGO.", "OGEEEGGGGGEEEGO."],
    hollow: ["OGEEEEGGGEEEEGO.", "OGEEEEGGGEEEEGO."],
  }[eyes]);
  rows.push("OGGGGGGGGGGGGGO.");
  rows.push(".OGDGGGGGGDGGO..");
  rows = rows.concat({
    blood: [".OGGRRGRRGRGGO..", ".OGGGRRRRRGGO..."],
    flat:  [".OGGDDDDDDDGGO..", ".OGGGGGGGGGGO..."],
    fangs: [".OGGEEREEREGGO..", ".OGGGWGGWGGGO..."],
    grin:  [".OGGDGGGGGDGGO..", ".OGGGGRRRGGGO..."],
  }[mouth]);
  rows.push("..OOGGGGGGOO....");
  if (wound && rng() < 0.8) {
    const x = 8 + Math.floor(rng() * 4);
    if ("GLD".includes(rows[1][x])) {
      rows[1] = rows[1].slice(0, x) + "R" + rows[1].slice(x + 1);
      rows[2] = rows[2].slice(0, x) + "R" + rows[2].slice(x + 1);
    }
  }
  return rows;
}

function propRows(prop) {
  if (prop === "book") return ["...OBBBBBBBO....", "..OSBPPPPPBBO...", "..OSBPPPPPPBO..."];
  if (prop === "knife") return ["...OSSSSSSSO....", "..OSSSLLSSSSO...", "..OSSSSLLSSSO..."];
  return ["...OSSSSSSSO....", "..OSSSSTSSSSO...", "..OSTTTTTTTTO..."];
}

function renderRows(spec) {
  const rng = rng32(spec.seed || 1);
  const r = resolve(spec);
  const rows = headRows(spec.palette || "rot", spec.eyes || "red",
                        spec.mouth || "blood", spec.hair || "messy",
                        spec.wound !== false, rng, r.hat);
  return rows.concat(r.torso);
}

function paint(ctx, spec, scale) {
  const rows = renderRows(spec);
  const [g, l, d] = PALETTES[spec.palette || "rot"];
  const r = resolve(spec);
  const pmap = {
    "G": [g[0], g[1], g[2], 255], "L": [l[0], l[1], l[2], 255],
    "D": [d[0], d[1], d[2], 255], "C": [r.main[0], r.main[1], r.main[2], 255],
    "F": [r.dark[0], r.dark[1], r.dark[2], 255],
    "O": O, "E": E, "W": W, "R": R, "S": S, "T": T, "B": B, "P": P,
    ".": [0, 0, 0, 0], "N": [44,60,96,255], "Y": [230,200,60,255],
    "M": [86,98,66,255], "H": [70,76,84,255],
  };
  for (let y = 0; y < rows.length; y++) {
    for (let x = 0; x < rows[y].length; x++) {
      const c = pmap[rows[y][x]];
      ctx.fillStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (c[3] / 255) + ")";
      ctx.fillRect(x * scale, y * scale, scale, scale);
    }
  }
}

function specFromUI() {
  return {
    palette: document.getElementById("palette").value,
    eyes: document.getElementById("eyes").value,
    mouth: document.getElementById("mouth").value,
    hair: document.getElementById("hair").value,
    occupation: document.getElementById("occupation").value,
    prop: document.getElementById("prop").value,
    wound: document.getElementById("wound").value === "1",
    seed: parseInt(document.getElementById("seed").value || "1", 10),
  };
}

function specToUI(spec) {
  document.getElementById("palette").value = spec.palette;
  document.getElementById("eyes").value = spec.eyes;
  document.getElementById("mouth").value = spec.mouth;
  document.getElementById("hair").value = spec.hair;
  document.getElementById("occupation").value = spec.occupation || "unemployed";
  document.getElementById("prop").value = spec.prop;
  document.getElementById("wound").value = spec.wound === false ? "0" : "1";
  document.getElementById("seed").value = spec.seed;
}

function download(canvas, name) {
  canvas.toBlob(function (blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
  });
}

let variants = [];

function drawAll() {
  const spec = specFromUI();
  const prev = document.getElementById("prev").getContext("2d");
  prev.clearRect(0, 0, 320, 320);
  paint(prev, spec, 10);
  const vc = document.getElementById("vars").getContext("2d");
  vc.clearRect(0, 0, 640, 192);
  variants.forEach(function (v, i) {
    paint(vc, v, 5);
    if (v.seed === spec.seed && v.occupation === spec.occupation) {
      vc.strokeStyle = "#ffd94d";
      vc.strokeRect((i % 4) * 160 + 1, Math.floor(i / 4) * 96 + 1, 158, 94);
    }
  });
}

function reroll() {
  variants = [];
  while (variants.length < 8) {
    const v = randomSpec();
    if (!variants.some(function (u) { return u.seed === v.seed; })) variants.push(v);
  }
  drawAll();
}

function randomSpec() {
  const r = Math.random;
  return {
    palette: Object.keys(PALETTES)[Math.floor(r() * Object.keys(PALETTES).length)],
    eyes: EYES[Math.floor(r() * EYES.length)],
    mouth: MOUTHS[Math.floor(r() * MOUTHS.length)],
    hair: HAIR[Math.floor(r() * HAIR.length)],
    occupation: OCCUPATION_KEYS[Math.floor(r() * OCCUPATION_KEYS.length)],
    prop: PROPS[Math.floor(r() * PROPS.length)],
    wound: r() < 0.6,
    seed: 1 + Math.floor(r() * 9999),
  };
}

(function boot() {
  if (typeof document === "undefined") { return; }   // node smoke tests skip the DOM
  fillSelect("occupation", OCCUPATION_KEYS);
  fillSelect("palette", Object.keys(PALETTES));
  fillSelect("eyes", EYES);
  fillSelect("mouth", MOUTHS);
  fillSelect("hair", HAIR);
  fillSelect("prop", PROPS);
  ["palette", "eyes", "mouth", "hair", "occupation", "prop", "wound", "seed"]
    .forEach(function (id) {
      document.getElementById(id).addEventListener("change", drawAll);
      document.getElementById(id).addEventListener("input", drawAll);
    });
  document.getElementById("rnd").addEventListener("click", reroll);
  document.getElementById("revars").addEventListener("click", reroll);
  document.getElementById("dl").addEventListener("click", function () {
    const c = document.createElement("canvas");
    c.width = 32; c.height = 32;
    paint(c.getContext("2d"), specFromUI(), 1);
    const s = specFromUI();
    download(c, "mtcde_" + s.occupation + "_" + s.seed + ".png");
  });
  document.getElementById("dlbig").addEventListener("click", function () {
    const c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    paint(c.getContext("2d"), specFromUI(), 8);
    const s = specFromUI();
    download(c, "mtcde_" + s.occupation + "_" + s.seed + "_8x.png");
  });
  document.getElementById("sheet").addEventListener("click", function () {
    const c = document.createElement("canvas");
    c.width = 8 * 164; c.height = 164;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#1d1f21";
    ctx.fillRect(0, 0, c.width, c.height);
    variants.forEach(function (v) { paint(ctx, v, 4.5); });
    download(c, "mtcde_forge_sheet.png");
  });
  document.getElementById("vars").addEventListener("click", function (e) {
    const rect = e.target.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / 160);
    const y = Math.floor((e.clientY - rect.top) / 96);
    const v = variants[y * 4 + x];
    if (v) { specToUI(v); drawAll(); }
  });
  reroll();
})();
</script>
</body>
</html>
